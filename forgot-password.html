
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نسيت كلمة المرور | عناية</title>
  <meta name="description" content="استعادة كلمة مرور حساب عناية">

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Cairo Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/landing.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary-green: #2E7D32;
      --dark-green: #1B5E20;
      --darker-green: #144517;
      --light-green: #E8F5E9;
      --mint-green: #C8E6C9;
      --cream-bg: #FAFAF7;
      --text-dark: #2D3A2F;
      --text-muted: #5F735F;
      --text-light: #8A9C8A;
      --border-light: #E0EADE;
      --white: #FFFFFF;
      --btn-hover: #256C2B;
      --transition: all .3s cubic-bezier(.25,.8,.25,1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--cream-bg);
      color: var(--text-dark);
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      line-height: 1.7;
      overflow-x: hidden;
      animation: pageFadeIn 0.35s ease-out forwards;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ==========================================================================
       UNIFIED AUTH HEADER (Identical across all login/auth pages)
       ========================================================================== */

    .site-header.forgot-header {
      width: 100%;
      background: var(--cream-bg);
      border-bottom: 1px solid rgba(224, 234, 222, 0.7);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .forgot-header .container {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      padding-inline: 24px;
    }

    .forgot-header .navbar {
      height: 72px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .forgot-header .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .forgot-header .brand-logo img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      transition: transform 0.3s ease;
    }

    .forgot-header .brand-logo:hover img {
      transform: scale(1.05);
    }

    .header-center-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    .center-arabic {
      font-family: 'Cairo', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #1B5E20;
      line-height: 1.25;
      letter-spacing: -0.3px;
    }

    .center-english {
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #8A9C8A;
      line-height: 1.2;
      letter-spacing: 1px;
    }

    .forgot-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-shrink: 0;
    }

    .forgot-nav .nav-link {
      font-family: 'Cairo', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      transition: var(--transition);
      display: inline-block;
    }

    .forgot-nav .nav-link:hover {
      color: var(--primary-green);
      background-color: rgba(46, 125, 50, 0.08);
    }

    /* =============================
       MAIN
    ============================= */

    .forgot-main {
      padding-top: 16px;
      padding-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .forgot-card {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 26px 30px;
      background: var(--white);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(27,94,32,.08);
    }

    /* ICON */

    .forgot-icon {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border-radius: 12px;
      background: var(--light-green);
      color: var(--primary-green);
    }

    .forgot-icon svg {
      width: 22px;
      height: 22px;
    }

    /* =============================
       TEXT
    ============================= */

    .form-header {
      margin-bottom: 14px;
    }

    .form-tag {
      display: inline-block;
      color: var(--text-muted);
      font-size: .76rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .form-title {
      color: var(--dark-green);
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.35;
      margin: 0 0 4px;
    }

    .form-subtitle {
      color: var(--text-muted);
      font-size: .84rem;
      font-weight: 400;
      line-height: 1.55;
      margin: 0;
    }

    /* =============================
       FORM
    ============================= */

    .forgot-form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 11px;
    }

    .form-label {
      display: block;
      font-size: .84rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 16px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      background: var(--white);
      color: var(--text-dark);
      font-size: .88rem;
      font-weight: 500;
      outline: none;
      transition: var(--transition);
    }

    .form-input[dir="ltr"] {
      text-align: left;
    }

    .form-input::placeholder {
      color: var(--text-light);
      font-weight: 400;
    }

    .form-input:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(46,125,50,.10);
    }

    .input-icon {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-green);
      pointer-events: none;
    }

    .input-icon svg {
      width: 16px;
      height: 16px;
    }

    .form-hint {
      display: block;
      margin-top: 4px;
      color: var(--text-muted);
      font-size: .72rem;
      line-height: 1.45;
    }

    /* =============================
       BUTTON
    ============================= */

    .forgot-submit {
      width: 100%;
      min-height: 42px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: var(--primary-green);
      color: var(--white);
      font-size: .88rem;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(46,125,50,.20);
      transition: var(--transition);
    }

    .forgot-submit:hover:not(:disabled) {
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46,125,50,.30);
    }

    .forgot-submit:disabled {
      opacity: .7;
      cursor: wait;
    }

    /* BACK LINK */

    .back-link {
      display: block;
      width: fit-content;
      margin: 14px auto 0;
      color: var(--primary-green);
      font-size: .82rem;
      font-weight: 700;
    }

    .back-link:hover {
      color: var(--dark-green);
      text-decoration: underline;
    }

    /* FOOTER */

    .forgot-footer {
      background: var(--cream-bg);
      color: var(--text-muted);
      text-align: center;
      font-size: .8rem;
      padding: 10px 0 16px;
    }

    /* ALERT FONT */

    .swal2-popup,
    .swal2-title,
    .swal2-html-container,
    .swal2-confirm {
      font-family: 'Cairo', sans-serif !important;
    }

    /* =============================
       RESPONSIVE
    ============================= */

    @media (max-width: 768px) {
      .forgot-card {
        padding: 22px 20px;
        max-width: 92%;
      }

      .forgot-nav {
        gap: 16px;
      }
    }

      .forgot-header .container {
        padding-inline: 16px;
      }

      .forgot-header .navbar {
        height: 64px;
        min-height: 64px;
      }

      .forgot-header .brand-logo img {
        width: 46px;
        height: 46px;
      }

      .forgot-nav .nav-link {
        font-size: 0.88rem;
        padding: 5px 10px;
      }

      .forgot-main {
        padding-top: 8px;
      }

      .forgot-card {
        padding: 20px 16px;
        border-radius: 18px;
      }

      .form-title {
        font-size: 1.25rem;
      }

      .form-input {
        height: 40px;
        font-size: .84rem;
      }
    

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =============================
       HEADER
  ============================= -->

  <header class="site-header forgot-header">
    <div class="container">
      <nav class="navbar">

        <!-- LOGO -->
        <a href="index.html" class="brand-logo">
          <img src="images/logo.png" alt="شعار عناية">
        </a>

        <!-- CENTER BRAND -->
        <div class="header-center-title">
          <span class="center-arabic">عناية</span>
          <span class="center-english">ENAYA</span>
        </div>

        <!-- NAVIGATION -->
        <ul class="forgot-nav">
          <li>
            <a href="index.html" class="nav-link">
              الرئيسية
            </a>
          </li>
        </ul>

      </nav>
    </div>
  </header>

  <!-- =============================
       MAIN CONTENT
  ============================= -->

  <main class="container forgot-main">

    <section class="forgot-card">

      <!-- ICON -->
      <div class="forgot-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round">

          <circle cx="15" cy="9" r="6"></circle>
          <path d="M10.8 13.2L3 21H1v-4l8-8"></path>
        </svg>
      </div>

      <!-- HEADER TEXT -->
      <div class="form-header">

        <span class="form-tag">
          استعادة الوصول · طلب الرابط
        </span>

        <h1 class="form-title">
          هل نسيت كلمة المرور؟
        </h1>

        <p class="form-subtitle">
          أدخل بريد حساب عناية لاستعادة الوصول
          وتعيين كلمة مرور جديدة وآمنة.
        </p>

      </div>

      <!-- FORM -->
      <form id="forgotForm" class="forgot-form" novalidate>

        <div class="form-group">

          <label for="email" class="form-label">
            البريد الإلكتروني
          </label>

          <div class="input-wrapper">

            <input
              class="form-input"
              type="email"
              id="email"
              dir="ltr"
              placeholder="name@example.com"
              autocomplete="email"
              required>

            <span class="input-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>

          </div>

          <span class="form-hint">
            استخدم البريد الإلكتروني المسجّل في حساب عناية.
          </span>

        </div>

        <!-- SUBMIT -->
        <button
          type="submit"
          class="forgot-submit"
          id="submitBtn">
          إرسال رابط الاستعادة
        </button>

      </form>

      <!-- BACK TO LOGIN -->
      <a href="login.html" class="back-link">
        ← العودة لتسجيل الدخول
      </a>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="forgot-footer">
    <div class="container">
      عناية © 2026 | أقرب لنباتاتك، كل يوم
    </div>
  </footer>

  <!-- =============================
       JAVASCRIPT
  ============================= -->

  <script src="js/auth.js"></script>

  <script>
    // قراءة البريد الإلكتروني من الرابط
    const urlParams = new URLSearchParams(
      window.location.search
    );

    const existingEmail = urlParams.get("email");

    if (existingEmail) {
      document.getElementById("email").value =
        existingEmail;
    }

    // تنبيهات عناية الموحدة
    function showAlert(icon, title, message) {
      if (icon === "success") {
        return EnayaAlert.success(
          title, message, "حسنًا"
        );
      }

      if (icon === "error") {
        return EnayaAlert.error(
          title, message, "حسنًا"
        );
      }

      if (icon === "warning") {
        return EnayaAlert.warning(
          title, message, "حسنًا"
        );
      }

      return EnayaAlert.info(
        title, message, "حسنًا"
      );
    }

    // إرسال نموذج الاستعادة
    document.getElementById("forgotForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document
          .getElementById("email")
          .value.trim();

        const submitBtn = document
          .getElementById("submitBtn");

        if (!email) {
          showAlert(
            "error",
            "حقل فارغ",
            "يرجى إدخال البريد الإلكتروني للمتابعة."
          );
          return;
        }

        const emailRegex =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
          showAlert(
            "error",
            "البريد الإلكتروني غير صحيح",
            "يرجى إدخال عنوان بريد إلكتروني صالح."
          );
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "جاري إرسال الرابط...";

        // طلب تجريبي فقط
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = "إرسال رابط الاستعادة";

          showAlert(
            "info",
            "طلب استعادة تجريبي 🌿",
            "هذه نسخة تجريبية، ولم يتم إرسال رابط استعادة فعلي إلى بريدك الإلكتروني."
          );
        }, 600);
      });
  </script>

</body>
</html>
